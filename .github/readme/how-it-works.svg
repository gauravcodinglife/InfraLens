<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How InfraLens works">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1324"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
    </marker>
  </defs>
  <rect width="1200" height="360" fill="url(#hbg)"/>
  <text x="40" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">How it works</text>
  <text x="40" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#94a3b8">From terraform plan to a risk-scored PR comment in under two minutes</text>

  <!-- connecting line -->
  <line x1="150" y1="210" x2="1050" y2="210" stroke="#1e293b" stroke-width="2"/>

  <!-- Step 1 -->
  <g transform="translate(60,120)">
    <rect width="220" height="180" rx="14" fill="#0f172a" stroke="#1e293b"/>
    <rect x="20" y="20" width="40" height="40" rx="10" fill="#3b82f61f" stroke="#3b82f6"/>
    <text x="33" y="47" font-family="Segoe UI" font-size="18" fill="#93c5fd" font-weight="700">1</text>
    <text x="20" y="90" font-family="Segoe UI" font-size="15" font-weight="700" fill="#e2e8f0">Terraform Plan</text>
    <text x="20" y="112" font-family="Segoe UI" font-size="12" fill="#94a3b8">terraform plan -out=tfplan</text>
    <text x="20" y="130" font-family="Segoe UI" font-size="12" fill="#94a3b8">runs inside your CI job</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(310,120)">
    <rect width="220" height="180" rx="14" fill="#0f172a" stroke="#1e293b"/>
    <rect x="20" y="20" width="40" height="40" rx="10" fill="#3b82f61f" stroke="#3b82f6"/>
    <text x="33" y="47" font-family="Segoe UI" font-size="18" fill="#93c5fd" font-weight="700">2</text>
    <text x="20" y="90" font-family="Segoe UI" font-size="15" font-weight="700" fill="#e2e8f0">Send to InfraLens</text>
    <text x="20" y="112" font-family="Segoe UI" font-size="12" fill="#94a3b8">POST plan.json to</text>
    <text x="20" y="130" font-family="Segoe UI" font-size="12" fill="#94a3b8">/api/v1/analyze</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(560,120)">
    <rect width="220" height="180" rx="14" fill="#0f172a" stroke="#1e293b"/>
    <rect x="20" y="20" width="40" height="40" rx="10" fill="#3b82f61f" stroke="#3b82f6"/>
    <text x="33" y="47" font-family="Segoe UI" font-size="18" fill="#93c5fd" font-weight="700">3</text>
    <text x="20" y="90" font-family="Segoe UI" font-size="15" font-weight="700" fill="#e2e8f0">Score &amp; Map Context</text>
    <text x="20" y="112" font-family="Segoe UI" font-size="12" fill="#94a3b8">Resources matched to</text>
    <text x="20" y="130" font-family="Segoe UI" font-size="12" fill="#94a3b8">owning services &amp; risk rules</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(810,120)">
    <rect width="220" height="180" rx="14" fill="#0f172a" stroke="#10b981" stroke-opacity="0.6"/>
    <rect x="20" y="20" width="40" height="40" rx="10" fill="#10b9811f" stroke="#10b981"/>
    <text x="33" y="47" font-family="Segoe UI" font-size="18" fill="#6ee7b7" font-weight="700">4</text>
    <text x="20" y="90" font-family="Segoe UI" font-size="15" font-weight="700" fill="#e2e8f0">PR Comment</text>
    <text x="20" y="112" font-family="Segoe UI" font-size="12" fill="#94a3b8">Risk score + plain-English</text>
    <text x="20" y="130" font-family="Segoe UI" font-size="12" fill="#94a3b8">business impact, inline</text>
  </g>

  <line x1="280" y1="210" x2="300" y2="210" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="210" x2="550" y2="210" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="780" y1="210" x2="800" y2="210" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
