<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="InfraLens dashboard preview">
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1324"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" fill="url(#dbg)"/>

  <!-- browser chrome -->
  <rect x="0" y="0" width="1200" height="44" fill="#0f172a"/>
  <circle cx="26" cy="22" r="6" fill="#ef4444"/>
  <circle cx="48" cy="22" r="6" fill="#f59e0b"/>
  <circle cx="70" cy="22" r="6" fill="#10b981"/>
  <rect x="110" y="10" width="420" height="24" rx="12" fill="#020617" stroke="#1e293b"/>
  <text x="128" y="26" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">app.infralens.io/dashboard</text>

  <!-- header -->
  <text x="40" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#f1f5f9">Organization Overview</text>
  <text x="40" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#94a3b8">Monitor risk trends and recent pull request analyses</text>

  <!-- stat cards -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(40,150)">
      <rect width="360" height="92" rx="12" fill="#0f172a" stroke="#1e293b"/>
      <text x="20" y="34" font-size="13" fill="#94a3b8">Analyses This Week</text>
      <text x="20" y="70" font-size="30" font-weight="700" fill="#f1f5f9">128</text>
    </g>
    <g transform="translate(420,150)">
      <rect width="360" height="92" rx="12" fill="#0f172a" stroke="#1e293b"/>
      <text x="20" y="34" font-size="13" fill="#94a3b8">Critical Risks Caught</text>
      <text x="20" y="70" font-size="30" font-weight="700" fill="#f1f5f9">9</text>
    </g>
    <g transform="translate(800,150)">
      <rect width="360" height="92" rx="12" fill="#0f172a" stroke="#1e293b"/>
      <text x="20" y="34" font-size="13" fill="#94a3b8">Avg Review Time Saved</text>
      <text x="20" y="70" font-size="30" font-weight="700" fill="#f1f5f9">34%</text>
    </g>
  </g>

  <!-- table -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="40" y="264" width="1120" height="230" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="64" y="298" font-size="17" font-weight="700" fill="#f1f5f9">Recent Analyses</text>

    <line x1="64" y1="318" x2="1096" y2="318" stroke="#1e293b"/>
    <g font-size="12" fill="#94a3b8" font-weight="600">
      <text x="64" y="338">REPOSITORY</text>
      <text x="360" y="338">PR</text>
      <text x="500" y="338">RISK</text>
      <text x="720" y="338">SERVICE</text>
      <text x="920" y="338">TIME</text>
    </g>

    <g font-size="13" fill="#e2e8f0">
      <line x1="64" y1="352" x2="1096" y2="352" stroke="#1e293b"/>
      <text x="64" y="374">core/payments-infra</text>
      <text x="360" y="374">#392</text>
      <text x="720" y="374">Checkout DB</text>
      <text x="920" y="374" fill="#94a3b8">2m ago</text>
      <rect x="500" y="358" width="90" height="22" rx="11" fill="#ef444426" stroke="#ef444455"/>
      <text x="512" y="374" fill="#fca5a5" font-size="12">Critical 88</text>

      <line x1="64" y1="404" x2="1096" y2="404" stroke="#1e293b"/>
      <text x="64" y="426">platform/networking</text>
      <text x="360" y="426">#410</text>
      <text x="720" y="426">Edge API</text>
      <text x="920" y="426" fill="#94a3b8">11m ago</text>
      <rect x="500" y="410" width="90" height="22" rx="11" fill="#f59e0b26" stroke="#f59e0b55"/>
      <text x="512" y="426" fill="#fcd34d" font-size="12">Review 51</text>

      <line x1="64" y1="456" x2="1096" y2="456" stroke="#1e293b"/>
      <text x="64" y="478">ops/monitoring</text>
      <text x="360" y="478">#77</text>
      <text x="720" y="478">Observability</text>
      <text x="920" y="478" fill="#94a3b8">23m ago</text>
      <rect x="500" y="462" width="78" height="22" rx="11" fill="#10b98126" stroke="#10b98155"/>
      <text x="512" y="478" fill="#6ee7b7" font-size="12">Safe 14</text>
    </g>
  </g>

  <!-- risk tester -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="40" y="516" width="1120" height="180" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="64" y="550" font-size="17" font-weight="700" fill="#f1f5f9">Risk Rule Tester</text>
    <text x="64" y="572" font-size="13" fill="#94a3b8">Try how InfraLens scores common infrastructure actions</text>

    <rect x="64" y="588" width="190" height="36" rx="8" fill="#3b82f6"/>
    <text x="86" y="611" font-size="13" font-weight="600" fill="#ffffff">Delete Production DB</text>

    <rect x="270" y="588" width="170" height="36" rx="8" fill="#3b82f6"/>
    <text x="292" y="611" font-size="13" font-weight="600" fill="#ffffff">Open SG to Public</text>

    <rect x="456" y="588" width="150" height="36" rx="8" fill="#3b82f6"/>
    <text x="478" y="611" font-size="13" font-weight="600" fill="#ffffff">Tag-only Change</text>

    <text x="64" y="656" font-size="13" fill="#cbd5e1">Critical 92/100: Deleting production DB can cause immediate data loss and downtime.</text>
  </g>
</svg>
